services:
  frontend:
    build:
      context: ./buffermate-frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://app.helicarrier.xyz
      - LARAVEL_API_URL=http://backend:8001
    depends_on:
      - backend

  backend:
    build:
      context: ./buffermate-backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - APP_URL=https://app.helicarrier.xyz
      - SANCTUM_STATEFUL_DOMAINS=app.helicarrier.xyz

