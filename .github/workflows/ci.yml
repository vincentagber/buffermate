name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND CI: Next.js 16 + React 19 Linting & Production Build
  # ----------------------------------------------------------------------------
  frontend:
    name: Next.js Frontend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buffermate-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: buffermate-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Production Bundle
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8001
          NEXT_PUBLIC_SUPABASE_URL: https://mock-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock
        run: npm run build

  # ----------------------------------------------------------------------------
  # 2. BACKEND CI: Laravel 11 + PHP 8.3 Unit & Feature Test Suite
  # ----------------------------------------------------------------------------
  backend:
    name: Laravel Backend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buffermate-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_pgsql, bcmath, curl, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Initialize SQLite Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run Laravel Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          APP_ENV: testing
          SUPABASE_JWT_SECRET: test_jwt_secret_for_ci_pipeline_verification_32ch
        run: php artisan test --parallel

