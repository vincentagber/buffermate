# ==============================================================================
# RENDER INFRASTRUCTURE AS CODE (BLUEPRINT SPECIFICATION)
# Application: BufferMate AI Platform
# Target Architecture: Web API, Background Queue Worker & Scheduled Cron
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
version: "1"

# ------------------------------------------------------------------------------
# SHARED ENVIRONMENT VARIABLES
# Injected into Web API, Background Queue Worker, and Cron Scheduler
# ------------------------------------------------------------------------------
envVarGroups:
  - name: buffermate-backend-env
    envVars:
      - key: APP_NAME
        value: BufferMate API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: UTC
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false # Connect to Supabase or Render Postgres connection string
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BACHS_API_KEY
        sync: false
      - key: BACHS_WEBHOOK_SECRET
        sync: false

services:
  # ----------------------------------------------------------------------------
  # 1. LARAVEL WEB API (Nginx + PHP 8.3 FPM)
  # ----------------------------------------------------------------------------
  - type: web
    name: buffermate-api
    runtime: docker
    dockerfilePath: buffermate-backend/Dockerfile
    dockerContext: buffermate-backend
    plan: starter
    healthCheckPath: /up
    numInstances: 1
    envVars:
      - fromGroup: buffermate-backend-env
      - key: APP_URL
        sync: false # Set to your deployed Render URL or custom API domain
      - key: FRONTEND_URL
        sync: false # Set to your Vercel frontend URL, e.g. https://buffermate.xyz

  # ----------------------------------------------------------------------------
  # 2. BACKGROUND QUEUE WORKER (Laravel Queue Runner)
  # ----------------------------------------------------------------------------
  - type: worker
    name: buffermate-worker
    runtime: docker
    dockerfilePath: buffermate-backend/Dockerfile
    dockerContext: buffermate-backend
    dockerCommand: php artisan queue:work --tries=3 --timeout=90 --sleep=3 --rest=1
    plan: starter
    numInstances: 1
    envVars:
      - fromGroup: buffermate-backend-env

  # ----------------------------------------------------------------------------
  # 3. CRON SCHEDULER (Laravel Task Scheduler)
  # ----------------------------------------------------------------------------
  - type: cron
    name: buffermate-scheduler
    runtime: docker
    dockerfilePath: buffermate-backend/Dockerfile
    dockerContext: buffermate-backend
    schedule: "* * * * *"
    dockerCommand: php artisan schedule:run
    plan: starter
    envVars:
      - fromGroup: buffermate-backend-env
